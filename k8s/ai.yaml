apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-uploads
  namespace: skinai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: skinai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - name: ai
          image: comprehensive-design-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: ai-uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: ai-uploads
          persistentVolumeClaim:
            claimName: ai-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: skinai
spec:
  selector:
    app: ai
  ports:
    - port: 8000
      targetPort: 8000
