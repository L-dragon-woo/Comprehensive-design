services:
  mariadb:
    image: mariadb:11
    container_name: skinai-mariadb
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-skinai}
      MARIADB_USER: ${MARIADB_USER:-skinai}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in backend/.env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in backend/.env}
    volumes:
      # MariaDB data files live in this named volume, so data survives container stop/remove.
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Keep this volume unless you intentionally want to reset the local database.
  mariadb_data:
