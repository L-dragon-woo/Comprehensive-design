# ============================================================
# Skin Analysis Pipeline Config
# ============================================================

gender: male   # male | female

root_dir: /workspace/pipeline

# MediaPipe FaceLandmarker
face_landmarker_model: inference_models/face_landmarker.task

# TFLite 모델 경로 및 입력 크기 (H x W)
tflite:
  age:
    model: inference_models/age_reg/epoch70_260317_122924.tflite
    input_size: [384, 384]
  pigment:
    model: inference_models/pigment_reg/epoch70_260305_112924.tflite
    input_size: [384, 384]
  wrinkle:
    model: inference_models/wrinkle_reg/epoch70_260306_124838.tflite
    input_size: [384, 384]
  homogenity:
    model: inference_models/homogenity_reg/epoch70_260320_182001.tflite
    input_size: [384, 384]

# 볼처짐·턱처짐 보정 파라미터 JSON
sagging:
  cheek:
    male:   inference_models/cheek-male_params.json
    female: inference_models/cheek-female_params.json
  chin:
    male:   inference_models/chin-male_params.json
    female: inference_models/chin-female_params.json

output_dir: inference_results

# Input quality gate. These defaults reject images where the models are likely
# to hallucinate confident skin scores: low resolution, blur, bad exposure,
# tiny/cropped face, or extreme pose.
quality_gate:
  min_short_side: 480
  min_brightness: 45.0
  max_brightness: 220.0
  min_laplacian_var: 45.0
  min_face_area_ratio: 0.12
  max_face_area_ratio: 0.85
  max_abs_yaw_rad: 0.35
  max_abs_pitch_rad: 0.35
  max_abs_roll_rad: 0.45
