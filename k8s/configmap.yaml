apiVersion: v1
kind: ConfigMap
metadata:
  name: skinai-config
  namespace: skinai
data:
  AI_SERVICE_URL: http://ai:8000
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/skinai_auth
  SPRING_DATASOURCE_USERNAME: skinai
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/skinai
  SPRING_MONGODB_URI: mongodb://mongo:27017/skinai
  MANAGEMENT_SERVER_PORT: "8081"
  VITE_API_PROXY_TARGET: http://backend:8080
  JWT_ISSUER: skinai
  JWT_ACCESS_TTL_SECONDS: "1800"
  JWT_REFRESH_TTL_SECONDS: "1209600"
