spring.application.name=backend
skinai.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/skinai_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:skinai}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:skinai}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/skinai}
spring.mongodb.uri=${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/skinai}}
spring.data.mongodb.auto-index-creation=true
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value}
app.jwt.issuer=${JWT_ISSUER:skinai}
app.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:1800}
app.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:1209600}
app.auth.admin-username=${AUTH_ADMIN_USERNAME:admin}
app.auth.admin-password=${AUTH_ADMIN_PASSWORD:admin1234}
app.kakao.rest-api-key=${KAKAO_REST_API_KEY:}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.web.resources.cache.cachecontrol.no-cache=true
