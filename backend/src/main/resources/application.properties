spring.application.name=backend

spring.datasource.url=${SKINAI_DB_URL:jdbc:mariadb://127.0.0.1:3307/skinai}
spring.datasource.username=${SKINAI_DB_USERNAME:skinai}
spring.datasource.password=${SKINAI_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

skinai.kakao.rest-api-key=${SKINAI_KAKAO_REST_API_KEY:}
